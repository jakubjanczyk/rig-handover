# Plan morning-digest § 3/§ 4 (ADR 0003). Builds the digest preview in CI and deploys it to
# GitHub Pages as an artifact, so the HTML is never committed. The banner takes the lane marker
# from the LANE_MARKER secret; delete the secret and run again to upload the page without it.
name: preview
on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preview:save /digest/2026-10-28 var/preview/index.html
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
      - run: grep -o '<span class="marker">[^<]*</span>' var/preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: var/preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
